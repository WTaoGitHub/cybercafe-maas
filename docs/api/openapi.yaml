                description: 先POST /maas/v1/artifacts上传图片，将art_REPLACE_WITH_UPLOADED_ID替换为响应id；不能直接提交占位符。
                value:
                  model: ocr.default
                  input:
                    image:
                      artifact_id: art_REPLACE_WITH_UPLOADED_ID
                  parameters: {}
                  timeout_seconds: 120
                  max_attempts: 1
              inlineBase64:
                summary: 方式二：image_base64内嵌PNG
                description: 有效4×3白色PNG示例，识别结果可能为空；实际OCR请替换为自己的PNG/JPEG完整base64 data URL。须设置Authorization和Idempotency-Key，与artifact_id互斥。本示例的新名称已发布；旧data_url仅保留兼容。
                value:
                  model: ocr.default
                  input:
                    image:
                      image_base64: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAADCAIAAAA7ljmRAAAAE0lEQVR4nGP8//8/AwwwwVnoHABvLQMDNeDq7AAAAABJRU5ErkJggg==
                  parameters: {}
                  timeout_seconds: 120
                  max_attempts: 1
              remoteImageUrl:
                summary: 方式三：公网图片URL
                description: 替换为MaaS服务器可访问的公开PNG/JPEG地址；示例域名仅占位。无登录/重定向/私网，MaaS下载后才返回202，不是传给worker临时读取。
                value:
                  model: ocr.default
                  input:
                    image:
                      image_url: https://example.org/replace-with-public-image.png
                  parameters: {}
                  timeout_seconds: 120
                  max_attempts: 1
      x-codeSamples:
      - lang: Shell
        label: curl：已上传图片引用
        source: "# 设置MAAS_BASE_URL、MAAS_API_KEY，并替换下面的真实artifact ID。\n# 新操作仅生成一次并保存；同次重试沿用原键和原JSON。\nIDEMPOTENCY_KEY=\"\
          $(python3 -c 'import uuid; print(uuid.uuid4())')\"\ncurl -i --request POST \\\n  --url \"$MAAS_BASE_URL/maas/v1/tasks\"\
          \ \\\n  --header \"Authorization: Bearer $MAAS_API_KEY\" \\\n  --header 'Accept: application/json' \\\n\
          \  --header 'Content-Type: application/json' \\\n  --header \"Idempotency-Key: $IDEMPOTENCY_KEY\" \\\n\
          \  --data '{\n    \"model\": \"ocr.default\",\n    \"input\": {\n      \"image\": {\n        \"artifact_id\"\
          : \"art_REPLACE_WITH_UPLOADED_ID\"\n      }\n    },\n    \"parameters\": {},\n    \"timeout_seconds\"\
          : 120,\n    \"max_attempts\": 1\n  }'\n"
      - lang: Shell
        label: curl：image_base64内嵌图片
        source: "# image_base64规范字段已部署；兼容旧data_url。\n# 此处PNG为有效4×3白色图片；真实识别请替换为自己的完整PNG/JPEG data URL。\n# 先设置MAAS_BASE_URL、MAAS_API_KEY；同次重试保持原幂等键和原JSON。\n\
          IDEMPOTENCY_KEY=\"$(python3 -c 'import uuid; print(uuid.uuid4())')\"\ncurl -i --request POST \\\n  --url\
          \ \"$MAAS_BASE_URL/maas/v1/tasks\" \\\n  --header \"Authorization: Bearer $MAAS_API_KEY\" \\\n  --header\
          \ 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --header \"Idempotency-Key:\
          \ $IDEMPOTENCY_KEY\" \\\n  --data '{\n  \"model\": \"ocr.default\",\n  \"input\": {\n    \"image\": {\n\
          \      \"image_base64\": \"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAADCAIAAAA7ljmRAAAAE0lEQVR4nGP8//8/AwwwwVnoHABvLQMDNeDq7AAAAABJRU5ErkJggg==\"\
          \n    }\n  },\n  \"parameters\": {},\n  \"timeout_seconds\": 120,\n  \"max_attempts\": 1\n}'\n"
      - lang: Shell
        label: curl：远程图片URL
        source: "# 异步image_url已部署；下载完成后才返回202。\n# 替换为服务器可下载的公开PNG/JPEG地址。\n# 先设置MAAS_BASE_URL、MAAS_API_KEY；同次重试保持原幂等键和原JSON。\n\
          IDEMPOTENCY_KEY=\"$(python3 -c 'import uuid; print(uuid.uuid4())')\"\ncurl -i --request POST \\\n  --url\
          \ \"$MAAS_BASE_URL/maas/v1/tasks\" \\\n  --header \"Authorization: Bearer $MAAS_API_KEY\" \\\n  --header\
          \ 'Accept: application/json' \\\n  --header 'Content-Type: application/json' \\\n  --header \"Idempotency-Key:\
          \ $IDEMPOTENCY_KEY\" \\\n  --data '{\n  \"model\": \"ocr.default\",\n  \"input\": {\n    \"image\": {\n\
          \      \"image_url\": \"https://example.org/replace-with-public-image.png\"\n    }\n  },\n  \"parameters\"\
          : {},\n  \"timeout_seconds\": 120,\n  \"max_attempts\": 1\n}'\n"
