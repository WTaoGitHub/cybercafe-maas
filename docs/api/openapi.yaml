components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: '在Swagger Authorize或VSCode插件的HTTP Bearer认证设置中填入管理员登记的推理key（通常只填key，工具添加Bearer前缀）。生成curl后检查是否包含Authorization:
        Bearer；缺失时手动添加。不要把真实key保存进OpenAPI或示例。该key须在GPUStack有效且有模型权限，不是管理key。'
  schemas:
    TaskCreate:
      additionalProperties: false
      properties:
        model:
          maxLength: 128
          minLength: 1
          title: Model
          type: string
          description: 已授权逻辑模型名，当前ocr.default。
        input:
          $ref: '#/components/schemas/OCRInput'
        parameters:
          $ref: '#/components/schemas/OCRParameters'
          default: {}
          description: OCR支持布尔型return_boxes，默认true。
        timeout_seconds:
          default: 120
          maximum: 3600
          minimum: 1
          title: Timeout Seconds
          type: integer
          description: 自受理开始的任务总期限，含排队；区别于模型单次运行预算。
        max_attempts:
          default: 3
          maximum: 3
          minimum: 1
          title: Max Attempts
          type: integer
          description: 最多领取/尝试次数。默认3；OCR不可安全重放，设置3不意味着对未知远端活动自动重试。
      required:
      - model
      - input
      title: TaskCreate
      type: object
      description: TaskCreate（与当前实现一致）
      examples:
      - model: ocr.default
        input:
          image:
            artifact_id: art_REPLACE_WITH_UPLOADED_ID
        parameters: {}
        timeout_seconds: 120
        max_attempts: 1
      - model: ocr.default
        input:
          image:
            image_base64: data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAADCAIAAAA7ljmRAAAAE0lEQVR4nGP8//8/AwwwwVnoHABvLQMDNeDq7AAAAABJRU5ErkJggg==
        parameters: {}
        timeout_seconds: 120
        max_attempts: 1
      - model: ocr.default
        input:
          image:
            image_url: https://example.org/replace-with-public-image.png
        parameters: {}
        timeout_seconds: 120
        max_attempts: 1
    TaskView:
      properties:
        id:
          title: Id
          type: string
          description: 任务ID。
        model:
          title: Model
          type: string
          description: 逻辑模型名。
        revision:
          title: Revision
          type: string
          description: 提交时绑定的模型版本。
        state:
          enum:
          - QUEUED
          - RUNNING
          - RETRY_WAIT
          - CANCEL_REQUESTED
          - CANCELLED
          - SUCCEEDED
          - FAILED
          title: State
          type: string
          description: 任务状态；HTTP200不代表任务成功。UNKNOWN是内部活动状态，不是任务state。
        attempts:
          minimum: 0
          title: Attempts
          type: integer
          description: 领取次数，不一定等于真实GPU执行次数。
        result_artifact_id:
          anyOf:
          - type: string
          - type: 'null'
          title: Result Artifact Id
          description: 成功结果文件ID，否则为null；需单独下载。
        error_code:
          anyOf:
          - type: string
          - type: 'null'
          title: Error Code
          description: 失败原因代码，否则可为null。
        deadline:
          format: date-time
          title: Deadline
          type: string
          description: 任务总期限。
        created_at:
          format: date-time
          title: Created At
          type: string
          description: 创建时间。
        updated_at:
          format: date-time
          title: Updated At
          type: string
          description: 最近更新时间。
      required:
      - id
      - model
      - revision
      - state
      - attempts
      - result_artifact_id
      - error_code
      - deadline
      - created_at
      - updated_at
      title: TaskView
      type: object
      description: TaskView（与当前实现一致）
      examples:
      - id: task_6032a4ff0f57481da1b09d4fb9888e33
