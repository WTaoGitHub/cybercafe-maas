openapi: 3.1.0
info:
  title: Cybercafe MaaS 对外OCR API
  version: '2026-11-02'
  description: 代码契约。/v1/ocr异步提交待部署。2026-11-02现网基线：artifact_id/image_base64/image_url三种输入、E16成功图片计量收据及两个查询接口均已部署并完成真实OCR验收。当前PP-OCRv4无真实token报告，tokens实际为null/unavailable。所有操作要求管理员登记且具有相应权限的Bearer推理key；资源按project隔离，客户端身份头不选择project。MaaS
    API路径不支持query参数；下载的图片URL可有查询参数，但不得包含用户密码或片段。当前入口≤20MiB、同步JSON默认≤20MiB、异步引用JSON≤64KiB、内嵌任务JSON≤20MiB、原图≤10MiB；入口错误可能返回HTML/plain
    text而非ApiError。当前运行配置8副本/8执行器、执行并发8/8、等待队列25/25，均可调整且不构成SLA。单次模型运行预算与总任务期限不同。未开放/v1/models、/healthz、管理API、Swagger
    UI或/openapi.json；此文件用于Swagger Editor/UI离线或自行托管导入。内嵌提交已发布，保留原artifact引用兼容。 成功及部分错误响应示例取自2026-11-02真实验收，自建文字测试图与默认白图请求不同；节点已脱敏，历史测试ID不可复用，不包含凭据或真实连接地址。
servers:
- url: http://{host}:{port}
  description: HTTP：本机/授权SSH转发或受控容器入口。localhost仅指当前调用环境；跨容器须替换host为运维提供的宿主机地址。
  variables:
    host:
      default: localhost
    port:
      default: '18831'
- url: https://{host}:{port}
  description: HTTPS：本机或授权SSH转发的私有TLS入口；须使用正确host并信任运维提供的证书，不默认绕过校验。
  variables:
    host:
      default: localhost
    port:
      default: '18832'
security:
- BearerAuth: []
tags:
- name: 同步OCR
  description: 同步完成并返回识别结果。
- name: 文件
  description: 上传和下载project隔离的输入/结果。
- name: 异步任务
  description: 受理、查询和取消持久任务。
- name: 模型能力
  description: 查询已登记及获授权能力，不代表实时GPU健康。
- name: 计量
  description: 成功图片与真实上游token用量事实，价格及收费归下游。
