openapi: 3.1.0
info:
  title: Cybercafe MaaS E2 OCR 批次 API
  version: 0.1.0-draft
  description: 待实现契约。复用现有项目隔离与文件接口。ID、日期和时限仅作示例。JSONL 的单行结构见各媒体类型的 x-jsonl-line-schema 或 x-jsonl-line-schemas。
security:
- BearerAuth: []
paths:
  /maas/v1/artifacts:
    post:
      operationId: uploadBatchArtifact
      summary: 上传 OCR 图片或批次清单
      description: 此处只展示批次使用的媒体类型。清单在创建批次时进行逐行校验。
      responses:
        '201':
          description: 上传成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactCreated'
              example:
                id: art_manifest
                size: 220
                sha256: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 文件或请求体超过字节限制。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: 不支持的媒体类型。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 触及队列、批次或存储额度。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      requestBody:
        required: true
        content:
          image/png:
            schema:
              type: string
              format: binary
              description: PNG 图片字节。
          image/jpeg:
            schema:
              type: string
              format: binary
              description: JPEG 图片字节。
          application/x-ndjson:
            schema:
              type: string
              description: UTF-8 JSONL，每个非空行是独立 JSON 对象。
            example: |
              {"custom_id": "page-001", "input": {"image": {"artifact_id": "art_page_001"}}, "parameters": {"return_boxes": false}}
              {"custom_id": "page-002", "input": {"image": {"artifact_id": "art_page_002"}}}
            x-jsonl-line-schema:
              $ref: '#/components/schemas/ManifestLine'
  /maas/v1/batches:
    post:
      operationId: createBatch
      summary: 创建 OCR 批次
      description: 整批校验后才接纳。每个 custom_id 在清单中唯一。首版建议每批最多 100 项，实际以服务端配置为准。
      responses:
        '202':
          description: 批次已接纳。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                id: batch_example
                model: ocr.default
                revision: r1
                status: QUEUED
                created_at: '2026-11-03T02:00:00Z'
                updated_at: '2026-11-03T02:00:00Z'
                deadline: '2026-11-03T03:00:00Z'
                counts:
                  total: 2
                  pending: 2
                  active: 0
                  succeeded: 0
                  failed: 0
                  cancelled: 0
                  expired: 0
                error: null
                outputs:
                  success_file_id: null
                  error_file_id: null
                  zip_file_id: null
                  zip_status: PENDING
                  zip_error: null
                  expires_at: null
          headers:
            Location:
              schema:
                type: string
              example: /maas/v1/batches/batch_example
        '200':
          description: 同项目、同幂等键且请求内容相同，返回已有批次的当前状态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                id: batch_example
                model: ocr.default
                revision: r1
                status: COMPLETED
                created_at: '2026-11-03T02:00:00Z'
                updated_at: '2026-11-03T02:00:00Z'
                deadline: '2026-11-03T03:00:00Z'
                counts:
                  total: 2
                  pending: 0
                  active: 0
                  succeeded: 1
                  failed: 1
                  cancelled: 0
                  expired: 0
                error: null
                outputs:
                  success_file_id: art_success
                  error_file_id: art_errors
                  zip_file_id: art_zip
                  zip_status: READY
                  zip_error: null
                  expires_at: '2026-11-04T02:00:00Z'
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '403':
          description: 凭据没有所需模型权限。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不可用、已过期或不属于当前项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: 幂等键已绑定不同请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 文件或请求体超过字节限制。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 参数或清单无效。逐行校验失败时 error.line 为从 1 开始的行号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 触及队列、批次或存储额度。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        description: 项目内幂等键。
        schema:
          type: string
          minLength: 1
          maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchCreate'
            example:
              model: ocr.default
              input_file_id: art_manifest
              timeout_seconds: 3600
  /maas/v1/batches/{batch_id}:
    parameters:
    - name: batch_id
      in: path
      required: true
      description: 批次 ID。
      schema:
        type: string
        pattern: ^batch_[a-z0-9_]+$
    get:
      operationId: getBatch
      summary: 查询批次状态及结果文件
      description: COMPLETED 表示清单已发布，批内可有失败项。取消和到期后保留已完成结果。
      responses:
        '200':
          description: 当前批次快照。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                id: batch_example
                model: ocr.default
                revision: r1
                status: COMPLETED
                created_at: '2026-11-03T02:00:00Z'
                updated_at: '2026-11-03T02:00:00Z'
                deadline: '2026-11-03T03:00:00Z'
                counts:
                  total: 2
                  pending: 0
                  active: 0
                  succeeded: 1
                  failed: 1
                  cancelled: 0
                  expired: 0
                error: null
                outputs:
                  success_file_id: art_success
                  error_file_id: art_errors
                  zip_file_id: art_zip
                  zip_status: READY
                  zip_error: null
                  expires_at: '2026-11-04T02:00:00Z'
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不可用、已过期或不属于当前项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /maas/v1/batches/{batch_id}/items:
    parameters:
    - name: batch_id
      in: path
      required: true
      description: 批次 ID。
      schema:
        type: string
        pattern: ^batch_[a-z0-9_]+$
    get:
      operationId: listBatchItems
      summary: 分页查询批次条目
      description: 游标绑定批次，条目顺序固定，状态可随执行推进。
      responses:
        '200':
          description: 按输入序号升序。next_cursor 为 null 时已到最后一页。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchItemsPage'
              example:
                items:
                - sequence: 1
                  custom_id: page-001
                  task_id: task_example_a
                  status: SUCCEEDED
                  error: null
                - sequence: 2
                  custom_id: page-002
                  task_id: task_example_b
                  status: FAILED
                  error:
                    code: UNKNOWN_BACKEND_ACTIVITY
                    message: 后端执行状态未确认。
                    retryable: false
                next_cursor: null
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不可用、已过期或不属于当前项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: 参数或清单无效。逐行校验失败时 error.line 为从 1 开始的行号。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
      parameters:
      - name: cursor
        in: query
        required: false
        description: 上一页返回的不透明游标。
        schema:
          type: string
          minLength: 1
      - name: limit
        in: query
        required: false
        description: 每页最多返回的条目数。
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
  /maas/v1/batches/{batch_id}/cancel:
    parameters:
    - name: batch_id
      in: path
      required: true
      description: 批次 ID。
      schema:
        type: string
        pattern: ^batch_[a-z0-9_]+$
    post:
      operationId: cancelBatch
      summary: 请求取消批次
      description: 停止新派发，收敛在途任务并保留部分结果。CANCEL_REQUESTED 表示请求已登记。
      responses:
        '200':
          description: 返回当前批次快照。已终结的批次返回已有终态。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Batch'
              example:
                id: batch_example
                model: ocr.default
                revision: r1
                status: CANCEL_REQUESTED
                created_at: '2026-11-03T02:00:00Z'
                updated_at: '2026-11-03T02:00:00Z'
                deadline: '2026-11-03T03:00:00Z'
                counts:
                  total: 2
                  pending: 2
                  active: 0
                  succeeded: 0
                  failed: 0
                  cancelled: 0
                  expired: 0
                error: null
                outputs:
                  success_file_id: null
                  error_file_id: null
                  zip_file_id: null
                  zip_status: PENDING
                  zip_error: null
                  expires_at: null
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不可用、已过期或不属于当前项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /maas/v1/artifacts/{artifact_id}:
    parameters:
    - name: artifact_id
      in: path
      required: true
      description: 文件 ID。
      schema:
        type: string
        pattern: ^art_[a-z0-9_]+$
    get:
      operationId: downloadBatchArtifact
      summary: 下载批次结果文件
      responses:
        '200':
          description: 按文件的实际媒体类型返回。JSONL 文件每行对应一条输入，使用 custom_id 关联。
          content:
            application/x-ndjson:
              schema:
                type: string
              x-jsonl-line-schemas:
                success:
                  $ref: '#/components/schemas/SuccessLine'
                error:
                  $ref: '#/components/schemas/FailureLine'
              examples:
                success:
                  value: |
                    {"custom_id": "page-001", "task_id": "task_example_a", "result_artifact_id": "art_result_a", "usage_id": "usage_task_task_example_a"}
                error:
                  value: |
                    {"custom_id": "page-002", "task_id": "task_example_b", "status": "FAILED", "error": {"code": "UNKNOWN_BACKEND_ACTIVITY", "message": "后端执行状态未确认。", "retryable": false}}
            application/zip:
              schema:
                type: string
                format: binary
                description: 包含成功清单、失败清单及 OCR 结果 JSON。
            application/json:
              schema:
                type: object
                description: 子任务的 OCR 结果文件，沿用现有单任务结果结构。
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '404':
          description: 资源不可用、已过期或不属于当前项目。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务暂时不可用。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
  /maas/v1/artifacts/batch:
    post:
      operationId: uploadImagesBatch
      summary: 批量上传 OCR 输入图片
      description: 使用 multipart/form-data。metadata 必须是第一个部件，其后为同名 files 部件，按顺序映射到 client_file_ids。服务端分别限制文件数、请求总字节和单图字节。请求级校验失败时不发布任何文件；请求有效时逐文件处理，即使所有文件均失败也返回
        200。成功文件归当前项目，可在 JSONL 中引用。每次调用独立创建文件，客户端按返回结果补传失败项。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              additionalProperties: false
              required:
              - metadata
              - files
              properties:
                metadata:
                  $ref: '#/components/schemas/BatchUploadMetadata'
                files:
                  type: array
                  minItems: 1
                  items:
                    type: string
                    format: binary
            encoding:
              metadata:
                contentType: application/json
              files:
                contentType: image/png, image/jpeg
                style: form
                explode: true
            example:
              metadata:
                client_file_ids:
                - page-001
                - page-002
              files:
              - <page-001.png bytes>
              - <page-002.jpg bytes>
      responses:
        '200':
          description: 逐文件处理结果，可部分成功。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchUploadResult'
              example:
                items:
                - client_file_id: page-001
                  status: UPLOADED
                  artifact_id: art_page_001
                - client_file_id: page-002
                  status: FAILED
                  error:
                    code: INVALID_IMAGE
                    message: 文件内容不是有效的 PNG 或 JPEG。
                    retryable: false
        '400':
          description: multipart 格式错误。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: 缺少有效 Bearer Key。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '413':
          description: 整请求或文件数量超过配置限制。单图超限在逐文件结果中报告。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '415':
          description: 请求不是 multipart/form-data。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '422':
          description: metadata 缺失、ID 重复、部件顺序错误或 ID 与文件数量不匹配。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '429':
          description: 请求级限流。逐文件存储额度不足在逐文件结果中报告。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '503':
          description: 服务无法开始处理请求。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
  schemas:
    BatchCreate:
      type: object
      additionalProperties: false
      required:
      - model
      - input_file_id
      properties:
        model:
          type: string
          minLength: 1
          maxLength: 128
        input_file_id:
          type: string
          pattern: ^art_[a-z0-9_]+$
        timeout_seconds:
          type: integer
          minimum: 1
          description: 批次执行期限，省略时用服务端默认值。最大值由服务端配置，超限返回 422。
    ManifestLine:
      type: object
      additionalProperties: false
      required:
      - custom_id
      - input
      properties:
        custom_id:
          type: string
          minLength: 1
          maxLength: 128
        input:
          type: object
          additionalProperties: false
          required:
          - image
          properties:
            image:
              type: object
              additionalProperties: false
              required:
              - artifact_id
              properties:
                artifact_id:
                  type: string
                  pattern: ^art_[a-z0-9_]+$
        parameters:
          type: object
          additionalProperties: false
          properties:
            return_boxes:
              type: boolean
              default: true
    Batch:
      type: object
      additionalProperties: false
      required:
      - id
      - model
      - revision
      - status
      - created_at
      - updated_at
      - deadline
      - counts
      - error
      - outputs
      properties:
        id:
          type: string
          pattern: ^batch_[a-z0-9_]+$
        model:
          type: string
        revision:
          type: string
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - FINALIZING
          - COMPLETED
          - FAILED
          - CANCEL_REQUESTED
          - CANCELLED
          - EXPIRED
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        deadline:
          type: string
          format: date-time
        counts:
          $ref: '#/components/schemas/BatchCounts'
        error:
          anyOf:
          - $ref: '#/components/schemas/ItemError'
          - type: 'null'
        outputs:
          $ref: '#/components/schemas/BatchOutputs'
    BatchCounts:
      type: object
      additionalProperties: false
      required:
      - total
      - pending
      - active
      - succeeded
      - failed
      - cancelled
      - expired
      properties:
        total:
          type: integer
          minimum: 0
        pending:
          type: integer
          minimum: 0
        active:
          type: integer
          minimum: 0
        succeeded:
          type: integer
          minimum: 0
        failed:
          type: integer
          minimum: 0
        cancelled:
          type: integer
          minimum: 0
        expired:
          type: integer
          minimum: 0
      description: 除 total 外各项互斥，其和等于 total。active 包含已派发且尚未终结的子任务。
    BatchOutputs:
      type: object
      additionalProperties: false
      required:
      - success_file_id
      - error_file_id
      - zip_file_id
      - zip_status
      - zip_error
      - expires_at
      properties:
        success_file_id:
          anyOf:
          - type: string
            pattern: ^art_[a-z0-9_]+$
          - type: 'null'
        error_file_id:
          anyOf:
          - type: string
            pattern: ^art_[a-z0-9_]+$
          - type: 'null'
        zip_file_id:
          anyOf:
          - type: string
            pattern: ^art_[a-z0-9_]+$
          - type: 'null'
        zip_status:
          type: string
          enum:
          - PENDING
          - READY
          - FAILED
          - EXPIRED
        zip_error:
          anyOf:
          - $ref: '#/components/schemas/ItemError'
          - type: 'null'
        expires_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
      description: 清单发布前文件 ID 为 null。成功与失败清单一起发布，空清单为零字节。ZIP 单独生成，失败时清单仍可下载。过期后按文件接口语义返回 404。
    ItemError:
      type: object
      additionalProperties: false
      required:
      - code
      - message
      - retryable
      properties:
        code:
          type: string
        message:
          type: string
        retryable:
          type: boolean
    ApiError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: object
          additionalProperties: false
          required:
          - code
          - message
          - retryable
          - request_id
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
            request_id:
              type: string
            line:
              type: integer
              minimum: 1
    BatchItem:
      type: object
      additionalProperties: false
      required:
      - sequence
      - custom_id
      - task_id
      - status
      - error
      properties:
        sequence:
          type: integer
          minimum: 1
        custom_id:
          type: string
          minLength: 1
          maxLength: 128
        task_id:
          anyOf:
          - type: string
            pattern: ^task_[a-z0-9_]+$
          - type: 'null'
        status:
          type: string
          enum:
          - PENDING
          - QUEUED
          - RETRY_WAIT
          - RUNNING
          - CANCEL_REQUESTED
          - SUCCEEDED
          - FAILED
          - CANCELLED
          - EXPIRED
        error:
          anyOf:
          - $ref: '#/components/schemas/ItemError'
          - type: 'null'
    BatchItemsPage:
      type: object
      additionalProperties: false
      required:
      - items
      - next_cursor
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BatchItem'
        next_cursor:
          anyOf:
          - type: string
          - type: 'null'
    SuccessLine:
      type: object
      additionalProperties: false
      required:
      - custom_id
      - task_id
      - result_artifact_id
      - usage_id
      properties:
        custom_id:
          type: string
          minLength: 1
          maxLength: 128
        task_id:
          type: string
          pattern: ^task_[a-z0-9_]+$
        result_artifact_id:
          type: string
          pattern: ^art_[a-z0-9_]+$
        usage_id:
          type: string
          pattern: ^usage_[a-z0-9_]+$
    FailureLine:
      type: object
      additionalProperties: false
      required:
      - custom_id
      - task_id
      - status
      - error
      properties:
        custom_id:
          type: string
          minLength: 1
          maxLength: 128
        task_id:
          anyOf:
          - type: string
            pattern: ^task_[a-z0-9_]+$
          - type: 'null'
        status:
          type: string
          enum:
          - FAILED
          - CANCELLED
          - EXPIRED
        error:
          $ref: '#/components/schemas/ItemError'
    ArtifactCreated:
      type: object
      additionalProperties: false
      required:
      - id
      - size
      - sha256
      properties:
        id:
          type: string
          pattern: ^art_[a-z0-9_]+$
        size:
          type: integer
          minimum: 1
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
    BatchUploadMetadata:
      type: object
      additionalProperties: false
      required:
      - client_file_ids
      properties:
        client_file_ids:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: string
            minLength: 1
            maxLength: 128
          description: 与 files 部件按出现顺序一一对应，数量须相同。
    BatchUploadItem:
      oneOf:
      - type: object
        additionalProperties: false
        required:
        - client_file_id
        - status
        - artifact_id
        properties:
          client_file_id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            const: UPLOADED
          artifact_id:
            type: string
            pattern: ^art_[a-z0-9_]+$
      - type: object
        additionalProperties: false
        required:
        - client_file_id
        - status
        - error
        properties:
          client_file_id:
            type: string
            minLength: 1
            maxLength: 128
          status:
            const: FAILED
          error:
            $ref: '#/components/schemas/ItemError'
    BatchUploadResult:
      type: object
      additionalProperties: false
      required:
      - items
      properties:
        items:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/BatchUploadItem'
          description: 按文件部件顺序返回，每个文件恰好一项。
