<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc"><title id="title">统一模型服务组件架构</title><desc id="desc">客户通过网关和框架API提交持久任务，执行器调用GPUStack管理的模型实例，结果保存在控制端。控制端必须常在线。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#5b728a"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;fill:#213d56} .label{font-size:15px;font-weight:600}.small{font-size:12px;fill:#566f85}</style><rect width="1200" height="850" fill="#f5f8fc"/><text x="38" y="38" font-size="24" font-weight="700">统一模型服务 · 组件架构</text><text x="38" y="64" class="small">目标架构 / 设计提案 · 2026-10-20 · 现有 GPUStack 与新增平台组件分工</text><rect x="30" y="175" width="1140" height="442" rx="16" fill="#eaf1f8" stroke="#bdcfdf"/><text x="50" y="201" class="label">001 常在线控制端（当前亦提供 GPU worker）</text><rect x="55" y="90" width="190" height="64" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="150.0" y="117" text-anchor="middle" class="label">客户 / SDK</text><text x="150.0" y="139" text-anchor="middle" class="small">统一模型别名与任务接口</text><rect x="935" y="90" width="215" height="64" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="1042.5" y="117" text-anchor="middle" class="label">本地 Mac 管理员</text><text x="1042.5" y="139" text-anchor="middle" class="small">SSH 私有管理访问</text><rect x="55" y="230" width="190" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="150.0" y="257" text-anchor="middle" class="label">客户网关</text><text x="150.0" y="279" text-anchor="middle" class="small">HTTPS / 请求与连接限制</text><rect x="295" y="230" width="300" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="445.0" y="257" text-anchor="middle" class="label">框架 API + 模型目录</text><text x="445.0" y="279" text-anchor="middle" class="small">鉴权 / schema / 幂等 / 查询</text><rect x="690" y="230" width="240" height="70" rx="10" fill="#fff7df" stroke="#b9cbd9"/><text x="810.0" y="257" text-anchor="middle" class="label">PostgreSQL</text><text x="810.0" y="279" text-anchor="middle" class="small">任务队列 / 租约 / 用量 / 状态</text><rect x="295" y="350" width="300" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="445.0" y="377" text-anchor="middle" class="label">执行器 + GPUStack connector</text><text x="445.0" y="399" text-anchor="middle" class="small">领取任务 / 并发槽 / 适配器调用</text><rect x="690" y="350" width="240" height="70" rx="10" fill="#fff7df" stroke="#b9cbd9"/><text x="810.0" y="377" text-anchor="middle" class="label">ArtifactStore</text><text x="810.0" y="399" text-anchor="middle" class="small">输入与权威结果 / 保留与清理</text><rect x="55" y="470" width="210" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="160.0" y="497" text-anchor="middle" class="label">协调器</text><text x="160.0" y="519" text-anchor="middle" class="small">回收 / 重试 / 节点排空</text><rect x="350" y="470" width="245" height="70" rx="10" fill="#dff1e8" stroke="#b9cbd9"/><text x="472.5" y="497" text-anchor="middle" class="label">现有 GPUStack 控制端</text><text x="472.5" y="519" text-anchor="middle" class="small">GPU 放置 / 模型部署 / 副本</text><rect x="690" y="470" width="240" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="810.0" y="497" text-anchor="middle" class="label">平台观测</text><text x="810.0" y="519" text-anchor="middle" class="small">结构化日志 / 指标 / 告警</text><text x="965" y="275" class="small">新增平台核心</text><text x="965" y="300" class="small">首版不拆微服务</text><text x="965" y="370" class="small">控制端持久卷</text><text x="965" y="395" class="small">worker 仅留缓存</text><text x="965" y="500" class="small">已有部署继续复用</text><path d="M150 154 L150 230" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M245 265 L295 265" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M595 265 L690 265" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M445 300 L445 350" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M595 375 L690 285" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="649.5" y="323.0" class="small">任务租约</text><path d="M595 395 L690 395" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)"/><text x="649.5" y="388.0" class="small">持久提交结果</text><path d="M360 420 L220 470" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="297.0" y="438.0" class="small">恢复与排空</text><path d="M470 420 L470 470" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="477.0" y="438.0" class="small">实例发现</text><path d="M595 505 L690 505" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="649.5" y="498.0" class="small">指标</text><path d="M1040 154 L550 230" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="802.0" y="185.0" class="small">私有管理</text><rect x="30" y="650" width="1140" height="145" rx="16" fill="#eef6f1" stroke="#b9d3c4"/><text x="50" y="677" class="label">GPU worker 资源池 · 模型适配器协议统一，输入输出按能力定义</text><rect x="55" y="700" width="300" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="205.0" y="727" text-anchor="middle" class="label">001 worker / GPU 实例</text><text x="205.0" y="749" text-anchor="middle" class="small">现有 OCR 适配器 · 临时缓存</text><rect x="435" y="700" width="300" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="585.0" y="727" text-anchor="middle" class="label">002 worker / GPU 实例</text><text x="585.0" y="749" text-anchor="middle" class="small">可排空退出 · 临时缓存</text><rect x="815" y="700" width="300" height="70" rx="10" fill="#fff" stroke="#b9cbd9"/><text x="965.0" y="727" text-anchor="middle" class="label">后续 worker / 模型适配器</text><text x="965.0" y="749" text-anchor="middle" class="small">更多节点与模型</text><path d="M300 385 L280 385 L280 580 L205 580 L205 700" fill="none" stroke="#196d96" stroke-width="2" marker-end="url(#arrow)"/><path d="M560 420 L630 420 L630 630 L585 630 L585 700" fill="none" stroke="#196d96" stroke-width="2" marker-end="url(#arrow)"/><text x="300" y="602" class="small">定向推理：仅选择 READY 实例；结果返回执行器</text><path d="M460 540 L350 700" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="412.0" y="613.0" class="small">部署</text><path d="M495 540 L780 700" fill="none" stroke="#5b728a" stroke-width="1.6" marker-end="url(#arrow)" stroke-dasharray="6 4"/><text x="644.5" y="613.0" class="small">部署与生命周期</text><text x="38" y="828" class="small">实线：请求 / 任务 / 数据路径　虚线：管理与控制路径　严格排空须纳入框架，旧 Playground 旁路请求不自动受控。</text></svg>