<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1120" viewBox="0 0 1440 1120" role="img" aria-labelledby="title desc"><title id="title">统一模型服务架构 v0.2</title><desc id="desc">固定GPUStack v2.2.3，客户同步请求直接走GPUStack；异步请求经任务API、独立PostgreSQL与执行器，再调用GPUStack。输入与权威结果保存在001控制端。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8" fill="#42657e"/></marker></defs><style>text{font-family:-apple-system,BlinkMacSystemFont,Segoe UI,PingFang SC,Microsoft YaHei,sans-serif;fill:#203d55}.t{font-size:17px;font-weight:650}.d{font-size:14px;fill:#506e84}.l{font-size:14px;fill:#265c7d}</style><rect width="1440" height="1120" fill="#f7fafd"/><text x="36" y="40" font-size="27" font-weight="700">统一模型服务架构 v0.2</text><text x="36" y="69" class="d">固定 GPUStack v2.2.3 + 最小持久任务层 · 2026-10-20 · 目标架构 · P0已验收/P1模拟闭环已验证，其余待实施</text><rect x="525" y="95" width="390" height="70" rx="10" fill="white" stroke="#b6cbdc"/><text x="720.0" y="124" text-anchor="middle" class="t">客户 / SDK</text><text x="720.0" y="148" text-anchor="middle" class="d">同一已登记的 GPUStack inference key</text><rect x="525" y="205" width="390" height="70" rx="10" fill="white" stroke="#b6cbdc"/><text x="720.0" y="234" text-anchor="middle" class="t">统一边缘入口</text><text x="720.0" y="258" text-anchor="middle" class="d">HTTPS / 路径分流 / 体积与连接限制</text><path d="M720 165 V205" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><rect x="25" y="325" width="1390" height="505" rx="16" fill="#eef3f8" stroke="#c6d4df"/><text x="45" y="354" class="t">001 常在线控制端 · 保留 GPU worker，控制端不能随节点切换系统</text><rect x="45" y="375" width="805" height="410" rx="12" fill="#e6f0fa" stroke="#a9c6df"/><text x="65" y="404" class="t">新增薄任务层 · 一个代码库，API 与执行器两个进程角色</text><rect x="885" y="375" width="510" height="410" rx="12" fill="#e3f1e9" stroke="#abcdb7"/><text x="905" y="404" class="t">复用 GPUStack v2.2.3</text><rect x="80" y="435" width="330" height="75" rx="10" fill="white" stroke="#b6cbdc"/><text x="245.0" y="464" text-anchor="middle" class="t">任务 API</text><text x="245.0" y="488" text-anchor="middle" class="d">上传 / 提交 / 幂等 / 查询 / 取消</text><rect x="500" y="435" width="300" height="75" rx="10" fill="white" stroke="#b6cbdc"/><text x="650.0" y="464" text-anchor="middle" class="t">身份桥接 AuthConnector</text><text x="650.0" y="488" text-anchor="middle" class="d">登记key映射 + 上游鉴权 / ACL</text><rect x="80" y="565" width="330" height="75" rx="10" fill="#fff7df" stroke="#b6cbdc"/><text x="245.0" y="594" text-anchor="middle" class="t">独立 PostgreSQL</text><text x="245.0" y="618" text-anchor="middle" class="d">持久队列 / attempt / 租约 / 用量</text><rect x="500" y="565" width="300" height="75" rx="10" fill="white" stroke="#b6cbdc"/><text x="650.0" y="594" text-anchor="middle" class="t">执行器 + 协调循环</text><text x="650.0" y="618" text-anchor="middle" class="d">领取 / 续租 / 有限重试 / 维护</text><rect x="80" y="695" width="330" height="70" rx="10" fill="#fff7df" stroke="#b6cbdc"/><text x="245.0" y="724" text-anchor="middle" class="t">ArtifactStore 持久卷</text><text x="245.0" y="748" text-anchor="middle" class="d">输入 / 权威结果 / 鉴权下载 / TTL</text><text x="500" y="715" class="d">结果模块属于任务层，不拆微服务。</text><text x="500" y="740" class="d">成功前必须完成控制端持久提交。</text><rect x="920" y="435" width="440" height="75" rx="10" fill="white" stroke="#b6cbdc"/><text x="1140.0" y="464" text-anchor="middle" class="t">GPUStack 推理入口</text><text x="1140.0" y="488" text-anchor="middle" class="d">API key / 模型ACL / 路由 / 同步 / SSE</text><rect x="920" y="565" width="440" height="75" rx="10" fill="white" stroke="#b6cbdc"/><text x="1140.0" y="594" text-anchor="middle" class="t">GPUStack 部署与资源管理</text><text x="1140.0" y="618" text-anchor="middle" class="d">模型目录 / backend / GPU放置 / 副本</text><rect x="920" y="695" width="440" height="70" rx="10" fill="white" stroke="#b6cbdc"/><text x="1140.0" y="724" text-anchor="middle" class="t">已有用量与监控</text><text x="1140.0" y="748" text-anchor="middle" class="d">worker健康 / GPU指标 / 基础usage</text><path d="M610 275 V305 H245 V435" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="65" y="299" class="l">异步 /maas/v1：提交、查询、下载</text><path d="M835 275 V305 H1140 V435" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="980" y="299" class="l">同步 / 流式：既有推理路径</text><path d="M410 472 H500" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="422" y="458" class="l">验证身份</text><path d="M800 472 H920" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="812" y="458" class="l">原生验证</text><path d="M245 510 V565" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="92" y="548" class="l">事务受理202</text><path d="M500 602 H410" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="418" y="589" class="l">领取 / 续租</text><path d="M800 602 H865 V530 H1140 V510" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="897" y="549" class="l">异步任务内部调用</text><path d="M245 640 V695" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="83" y="681" class="l">元数据 / 结果引用</text><path d="M580 640 V665 H430 V730 H410" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="455" y="687" class="l">写入并原子提交结果</text><rect x="25" y="880" width="1390" height="145" rx="16" fill="#f1f6f2" stroke="#c2d7c9"/><text x="45" y="909" class="t">GPU worker 资源池 · 只有适配器包含模型算法，worker 可保留临时缓存</text><rect x="70" y="930" width="370" height="70" rx="10" fill="white" stroke="#b6cbdc"/><text x="255.0" y="959" text-anchor="middle" class="t">001 worker</text><text x="255.0" y="983" text-anchor="middle" class="d">模型适配器 → GPU实例</text><rect x="535" y="930" width="370" height="70" rx="10" fill="white" stroke="#b6cbdc"/><text x="720.0" y="959" text-anchor="middle" class="t">002 worker</text><text x="720.0" y="983" text-anchor="middle" class="d">模型适配器 → GPU实例</text><rect x="1000" y="930" width="370" height="70" rx="10" fill="white" stroke="#b6cbdc"/><text x="1185.0" y="959" text-anchor="middle" class="t">后续 worker</text><text x="1185.0" y="983" text-anchor="middle" class="d">按相同接入规范扩容</text><path d="M1360 472 H1380 V855 H720 V930" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)"/><text x="1125" y="846" class="l">推理与结果返回</text><path d="M1140 640 V665 H1400 V865 H255 V930" fill="none" stroke="#42657e" stroke-width="1.8" marker-end="url(#arrow)" stroke-dasharray="7 5"/><text x="62" y="854" class="l">部署 / 副本 / 健康管理</text><text x="36" y="1064" class="d">首期维护：全局暂停派发与同步旁路 → 核对在途/未知执行 → maintenance → 恢复探测；不是精确逐节点无损 drain。</text><text x="36" y="1092" class="d">实线：调用 / 数据　虚线：控制 / 验证　黄色：新增持久存储　绿色：复用已有底座　无 main 专属能力依赖。</text></svg>