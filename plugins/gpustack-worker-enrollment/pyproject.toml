[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maas-gpustack-worker-enrollment"
version = "0.2.0"
requires-python = ">=3.11"

[project.entry-points."gpustack.plugins"]
maas_worker_enrollment = "maas_worker_enrollment:WorkerEnrollmentPlugin"

[tool.setuptools]
py-modules = ["maas_worker_enrollment", "maas_worker_handoff"]
