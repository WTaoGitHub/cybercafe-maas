[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "maas-gpustack-replica"
version = "0.4.0"
requires-python = ">=3.11"

[project.entry-points."gpustack.plugins"]
maas_replica = "maas_replica:ReplicaPlugin"

[tool.setuptools]
py-modules = ["maas_replica", "maas_replica_policy"]
