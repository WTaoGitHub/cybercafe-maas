worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 256; }
http {
    access_log off;
    client_body_temp_path /tmp/client;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    map $uri $maas_path {
        default 0;
        /v1/chat/completions 1;
        /ocr 1;
        /v1/ocr 1;
        ~^/maas/v1/usage/[a-z0-9_]+$ 1;
        ~^/maas/v1/tasks/[a-z0-9_]+/usage$ 1;
        ~^/maas/v1/(artifacts|tasks)(/[a-z0-9_]+)?(/cancel)?$ 1;
        ~^/maas/v1/models/[a-zA-Z0-9_.-]+/capabilities$ 1;
    }
    server {
        listen 127.0.0.1:18831;
        listen [::1]:18831;
        server_name _;
        client_max_body_size 20m;
        client_body_timeout 15s;
        location / {
            if ($maas_path = 0) { return 404; }
            if ($args != "") { return 400; }
            limit_except GET POST { deny all; }
            proxy_pass http://127.0.0.1:18830;
            proxy_http_version 1.1;
            proxy_read_timeout 125s;
            proxy_send_timeout 15s;
            proxy_connect_timeout 3s;
            proxy_next_upstream off;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie "";
            proxy_set_header X-Project "";
            proxy_set_header X-User-ID "";
            proxy_set_header X-Organization-ID "";
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Connection "";
        }
    }
}
