# Run from repository root: docker compose --env-file <private-env> -f deploy/maas/compose.yaml up -d
name: maas-tasks
x-app: &app
  image: ${MAAS_TASK_IMAGE:-cybercafe-maas-tasks:p4-r1}
  build:
    context: ../..
    dockerfile: deploy/maas/Dockerfile
  restart: unless-stopped
  network_mode: host
  command: [uvicorn, "maas_platform.api:create_app", --factory, --host, "127.0.0.1", --port, "18830"]
  environment:
    MAAS_DATABASE_URL: postgresql://maas:${MAAS_DB_PASSWORD:?set private environment}@127.0.0.1:18835/maas
    MAAS_GPUSTACK_URL: ${MAAS_GPUSTACK_URL:?set reachable internal GPUStack URL}
    MAAS_ARTIFACT_ROOT: /var/lib/maas/artifacts
    MAAS_BINDINGS_FILE: /run/secrets/bindings.json
    MAAS_CATALOG_FILE: /app/catalog.json
    MAAS_PEPPER_FILE: /run/secrets/pepper
    MAAS_MAX_INPUT_BYTES: ${MAAS_MAX_INPUT_BYTES:-10485760}
    MAAS_MAX_OUTPUT_BYTES: ${MAAS_MAX_OUTPUT_BYTES:-20971520}
    MAAS_MAX_QUEUED: ${MAAS_MAX_QUEUED:-1000}
    MAAS_MAX_PROJECT_QUEUED: ${MAAS_MAX_PROJECT_QUEUED:-100}
    MAAS_MAX_RUNNING: ${MAAS_MAX_RUNNING:-2}
    MAAS_MAX_PROJECT_RUNNING: ${MAAS_MAX_PROJECT_RUNNING:-1}
    MAAS_LEASE_SECONDS: ${MAAS_LEASE_SECONDS:-30}
    MAAS_HEARTBEAT_SECONDS: ${MAAS_HEARTBEAT_SECONDS:-5}
    MAAS_RESULT_TTL_SECONDS: ${MAAS_RESULT_TTL_SECONDS:-86400}
    MAAS_INPUT_TTL_SECONDS: ${MAAS_INPUT_TTL_SECONDS:-86400}
    MAAS_MAX_STORAGE_BYTES: ${MAAS_MAX_STORAGE_BYTES:-10737418240}
    MAAS_MAX_PROJECT_STORAGE_BYTES: ${MAAS_MAX_PROJECT_STORAGE_BYTES:-2147483648}
    MAAS_ORPHAN_GRACE_SECONDS: ${MAAS_ORPHAN_GRACE_SECONDS:-3600}
    MAAS_CLEANUP_BATCH_SIZE: ${MAAS_CLEANUP_BATCH_SIZE:-200}
    MAAS_MIN_FREE_BYTES: ${MAAS_MIN_FREE_BYTES:-2147483648}
  volumes:
    - ${MAAS_SECRET_DIR:?set private secret directory}:/run/secrets:ro
    - ${MAAS_CATALOG_PATH:?set absolute registered OCR catalog path}:/app/catalog.json:ro
    - ${MAAS_TRUSTED_DIR:?set collector consumer export directory}:/run/maas-trusted:ro
    - ${MAAS_PROBE_DIR:?set non-secret probe image directory}:/run/maas-probe:ro
    - artifacts:/var/lib/maas/artifacts
  depends_on:
    db:
      condition: service_healthy
services:
  db:
    image: postgres:16-alpine
    network_mode: host
    command: [postgres, -c, "listen_addresses=127.0.0.1", -p, "18835"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: maas
      POSTGRES_DB: maas
      POSTGRES_PASSWORD: ${MAAS_DB_PASSWORD:?set private environment}
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -h 127.0.0.1 -p 18835 -U maas -d maas]
      interval: 3s
      retries: 20
  api:
    <<: *app
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:18830/healthz',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
      start_period: 10s
  executor:
    <<: *app
    command: [python, -m, maas_platform.worker]
  observer:
    <<: *app
    command: [python, -m, maas_platform.observe, --loop, --output, /var/lib/maas/artifacts/.observability]
volumes:
  postgres:
  artifacts:
